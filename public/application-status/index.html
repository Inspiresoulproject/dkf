<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Application Status | DKF</title><link rel="stylesheet" href="/laptop-style.css"></head><body><header><a href="/">← Digital Kids Foundation</a><h1>Check Application Status</h1></header><main><form id="status"><p>Enter your application reference and registered email. We will send a one-time status link to your email.</p><label>Application reference <input name="reference" placeholder="DKF-LAP-XXXXXXXXXX" required></label><label>Registered email <input name="email" type="email" required></label><button>Send secure status link</button><p id="msg" role="status"></p></form></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#msg');try{const r=await fetch('/api/laptops/status-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const j=await r.json();m.textContent=j.message||j.error||'Unable to send link'}catch(e){m.textContent='Please try again later'}}</script></body></html>
